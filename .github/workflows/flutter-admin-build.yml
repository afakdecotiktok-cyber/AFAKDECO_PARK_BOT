name: Flutter Admin App CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin_app/**"
      - ".github/workflows/flutter-admin-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin_app/**"
      - ".github/workflows/flutter-admin-build.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend Python syntax
        run: python3 -m py_compile ../bot_with_web.py ../accident_flow.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --project-name afakdeco_admin --org com.afakdeco .
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              application_tag = '    <application'
              if application_tag not in content:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              content = content.replace(application_tag, f"{permission}\\n{application_tag}", 1)
              manifest.write_text(content)
          print("Verified INTERNET permission in AndroidManifest.xml")
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - name: Generate AFAK PARK launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path("assets/afak_park_icon.svg")
          if not source.exists():
              raise SystemExit(f"Missing launcher icon source: {source}")
          res = Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target_dir = res / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              target = target_dir / "ic_launcher.png"
              subprocess.run(
                  ["rsvg-convert", "-w", str(size), "-h", str(size), "-o", str(target), str(source)],
                  check=True,
              )
              (target_dir / "ic_launcher_round.png").write_bytes(target.read_bytes())
          # Use density-specific raster icons instead of Flutter's generated adaptive icon.
          (res / "mipmap-anydpi-v26").mkdir(exist_ok=True)
          adaptive = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = adaptive / name
              if path.exists():
                  path.unlink()
          print("Generated AFAK PARK icons for all Android densities.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afakdeco-admin-android-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
