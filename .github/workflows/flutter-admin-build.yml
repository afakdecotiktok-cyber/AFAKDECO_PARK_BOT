name: Flutter Admin App CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin_app/**"
      - ".github/workflows/flutter-admin-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin_app/**"
      - ".github/workflows/flutter-admin-build.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check backend Python syntax
        run: python3 -m py_compile ../bot_with_web.py ../accident_flow.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Generate Android platform project
        run: |
          flutter create --platforms=android --project-name afakdeco_admin --org com.afakdeco .
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              application_tag = '    <application'
              if application_tag not in content:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              content = content.replace(application_tag, f"{permission}\\n{application_tag}", 1)
              manifest.write_text(content)
          print("Verified INTERNET permission in AndroidManifest.xml")
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afakdeco-admin-android-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
