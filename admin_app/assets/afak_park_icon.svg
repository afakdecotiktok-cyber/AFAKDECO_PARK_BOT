<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A43" flood-opacity="0.15" />
    </filter>
    <filter id="vanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#102A43" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background App Container -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="#F7F3E8" stroke="#102A43" stroke-width="20" filter="url(#shadow)" />

  <!-- Decorative Background Elements / Safe Area Grid Hint -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#D8DEE5" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Location Pin (Background Element) -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <!-- Pin Shadow/Glow -->
    <ellipse cx="0" cy="190" rx="25" ry="10" fill="#102A43" opacity="0.2" />
    <!-- Pin Body -->
    <path d="M 0 0 C -45 0 -80 35 -80 80 C -80 135 0 190 0 190 C 0 190 80 135 80 80 C 80 35 45 0 0 0 Z" fill="#1769AA" />
    <!-- Pin Inner Circle -->
    <circle cx="0" cy="80" r="32" fill="#F7F3E8" />
    <circle cx="0" cy="80" r="16" fill="#1769AA" />
  </g>

  <!-- Curved Road -->
  <path d="M 120 740 Q 512 600 904 740 L 904 840 Q 512 700 120 840 Z" fill="#36A66A" />
  <!-- Road Center Dashes -->
  <path d="M 180 775 Q 512 638 844 775" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="24 24" opacity="0.8" />

  <!-- Brand Title: AFAK PARK -->
  <text x="512" y="180" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#102A43" letter-spacing="10" text-anchor="middle">AFAK PARK</text>

  <!-- Central Subject: Modern Renault Master Delivery Van (Front Three-Quarter View) -->
  <g transform="translate(160, 310)" filter="url(#vanShadow)">
    <!-- Van Ground Shadow -->
    <ellipse cx="352" cy="370" rx="310" ry="24" fill="#102A43" opacity="0.25" />

    <!-- Rear/Underbody Base -->
    <path d="M 100 320 L 590 320 L 620 350 L 80 350 Z" fill="#102A43" />

    <!-- Tires -->
    <!-- Rear Tire -->
    <g transform="translate(220, 335)">
      <rect x="-45" y="-45" width="90" height="90" rx="30" fill="#102A43" />
      <circle cx="0" cy="0" r="28" fill="#D8DEE5" />
      <circle cx="0" cy="0" r="12" fill="#102A43" />
    </g>
    <!-- Front Tire -->
    <g transform="translate(530, 335)">
      <rect x="-45" y="-45" width="90" height="90" rx="30" fill="#102A43" />
      <circle cx="0" cy="0" r="28" fill="#D8DEE5" />
      <circle cx="0" cy="0" r="12" fill="#102A43" />
    </g>

    <!-- Main Van Body (White Panel Van) -->
    <!-- Lower Body & Side Panel -->
    <path d="M 80 180 
             L 380 140 
             L 600 200 
             L 620 330 
             L 80 330 Z" fill="#FFFFFF" />

    <!-- High Roof Structure -->
    <path d="M 120 180 
             L 360 80 
             L 520 110 
             L 580 200 
             L 120 180 Z" fill="#F4F6F8" />

    <!-- Roof Panel Line / Shading -->
    <path d="M 360 80 L 520 110 L 580 200 L 380 140 Z" fill="#EAEFF4" />

    <!-- Front Grille & Bumper Section -->
    <path d="M 520 220 
             L 610 240 
             L 620 330 
             L 520 330 Z" fill="#102A43" />

    <!-- Grille Details (Horizontal Slats) -->
    <line x1="540" y1="260" x2="595" y2="270" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="545" y1="280" x2="600" y2="290" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="550" y1="300" x2="605" y2="310" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Renault Diamond Emblem on Grille -->
    <polygon points="572,235 584,250 572,265 560,250" fill="#FFFFFF" />

    <!-- Headlight (Front) -->
    <path d="M 600 215 C 605 215 615 220 618 235 L 610 240 L 595 218 Z" fill="#D8DEE5" />

    <!-- Windshield -->
    <path d="M 390 145 
             L 515 118 
             L 535 215 
             L 390 220 Z" fill="#102A43" />

    <!-- Side Windows (Driver Cab) -->
    <path d="M 230 160 
             L 375 148 
             L 375 225 
             L 215 220 Z" fill="#102A43" />
    
    <!-- Side Door Seam & Panel Lines -->
    <line x1="390" y1="145" x2="390" y2="330" stroke="#D8DEE5" stroke-width="4" />
    <line x1="220" y1="220" x2="600" y2="220" stroke="#D8DEE5" stroke-width="4" />
    <path d="M 270 240 L 350 240 L 350 310 L 270 310 Z" fill="none" stroke="#D8DEE5" stroke-width="3" />

    <!-- Side Cargo Panel Indentation -->
    <rect x="80" y="240" width="160" height="70" rx="10" fill="none" stroke="#D8DEE5" stroke-width="4" />
  </g>
</svg>
